<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercices SER y ESTAR</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --success: #2ecc71;
      --error: #e74c3c;
      --text: #2c3e50;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      max-width: 700px;
      width: 100%;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-top: 0;
    }

    .level-nav {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      gap: 10px;
    }

    .level-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid var(--primary);
      background-color: white;
      color: var(--primary);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .level-btn.active, .level-btn:hover {
      background-color: var(--primary);
      color: white;
    }

    .exercise-item {
      background-color: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      border-left: 5px solid var(--primary);
      margin-bottom: 15px;
    }

    .sentence {
      font-size: 1.1em;
      line-height: 1.6;
    }

    input[type="text"] {
      font-size: 1em;
      padding: 6px 10px;
      border: 2px solid #ccc;
      border-radius: 4px;
      width: 110px;
      text-align: center;
      font-weight: bold;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .accents-toolbar {
      margin-top: 10px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .accent-btn {
      padding: 4px 8px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .accent-btn:hover {
      background: #e0e0e0;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .action-btn:hover {
      opacity: 0.9;
    }

    .score-box {
      text-align: center;
      padding: 20px;
      background-color: #eef5fc;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .score-box h2 {
      margin: 0 0 10px 0;
      color: var(--primary);
    }

    .correction-item {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .correction-item.correct {
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }

    .correction-item.incorrect {
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }

    .explanation {
      margin-top: 8px;
      font-size: 0.95em;
      font-weight: normal;
      color: #333;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>SER vs ESTAR</h1>
  
  <div class="level-nav">
    <button class="level-btn active" onclick="changeLevel(0)">Niveau 1 : Facile</button>
    <button class="level-btn" onclick="changeLevel(1)">Niveau 2 : Moyen</button>
    <button class="level-btn" onclick="changeLevel(2)">Niveau 3 : Difficile</button>
  </div>

  <div class="accents-toolbar">
    <span style="font-size:0.85em; color:#666;">Insérer un caractère :</span>
    <button class="accent-btn" onclick="insertChar('á')">á</button>
    <button class="accent-btn" onclick="insertChar('é')">é</button>
    <button class="accent-btn" onclick="insertChar('í')">í</button>
    <button class="accent-btn" onclick="insertChar('ó')">ó</button>
    <button class="accent-btn" onclick="insertChar('ú')">ú</button>
    <button class="accent-btn" onclick="insertChar('ñ')">ñ</button>
  </div>
  <br>

  <div id="quiz-container">
    <div id="questions-list"></div>
    <button class="action-btn" onclick="submitAnswers()">Voir la correction</button>
  </div>

  <div id="result-container" style="display: none;">
    <div class="score-box">
      <h2>Résultats du niveau</h2>
      <p id="score-text" style="font-size: 1.4em; font-weight: bold; margin: 0;"></p>
    </div>
    <div id="corrections-list"></div>
    <button class="action-btn" onclick="restartLevel()">Recommencer ce niveau</button>
  </div>
</div>

<script>
  const exercises = [
    // Niveau 1
    [
      { before: "1. Yo ", after: " estudiante de español.", answer: "soy", explanation: "On utilise **SER** pour l'identité et la profession[cite: 1]." },
      { before: "2. Mis hermanos ", after: " en casa hoy.", answer: "están", explanation: "On utilise **ESTAR** pour la localisation dans l'espace[cite: 1]." },
      { before: "3. Hoy María ", after: " muy contenta.", answer: "está", explanation: "On utilise **ESTAR** pour un état d'esprit temporaire[cite: 1]." },
      { before: "4. Nosotros ", after: " de España.", answer: "somos", explanation: "On utilise **SER** pour la nationalité et l'origine[cite: 1]." },
      { before: "5. ¿Tú ", after: " preparado para el examen?", answer: "estás", explanation: "On utilise **ESTAR** pour un état d'avancement ou de préparation." }
    ],
    // Niveau 2
    [
      { before: "1. Esta manzana ", after: " verde, aún no se puede comer.", answer: "está", explanation: "**Estar verde** signifie que le fruit n'est pas mûr (état temporaire)." },
      { before: "2. El coche de Carlos ", after: " verde.", answer: "es", explanation: "**Ser verde** fait référence à la couleur permanente d'un objet." },
      { before: "3. Juan ", after: " muy listo, siempre obtiene las mejores notas.", answer: "es", explanation: "**Ser listo** veut dire être intelligent (caractéristique permanente)[cite: 1]." },
      { before: "4. Ya ", after: " listo para salir de viaje.", answer: "estoy", explanation: "**Estar listo** signifie être prêt (état temporaire)." },
      { before: "5. La reunión ", after: " en la segunda planta.", answer: "es", explanation: "Pour un événement (réunion, fête, concert), la localisation se fait avec **SER**." }
    ],
    // Niveau 3
    [
      { before: "1. Ayer la película ", after: " muy aburrida.", answer: "fue", explanation: "Passé simple (**Pretérito Indefinido**) de **SER** pour évaluer un événement terminé." },
      { before: "2. Cuando éramos niños, nosotros siempre ", after: " cansados después de jugar.", answer: "estábamos", explanation: "Imparfait (**Pretérito Imperfecto**) de **ESTAR** pour décrire un état habituel dans le passé." },
      { before: "3. El libro ", after: " escrito por Gabriel García Márquez.", answer: "fue", explanation: "La voix passive d'action se construit avec **SER** + participe passé." },
      { before: "4. La puerta ", after: " cerrada cuando llegué a la oficina.", answer: "estaba", explanation: "La voix passive d'état (résultat d'une action) se construit avec **ESTAR**." },
      { before: "5. Aunque el profesor es muy mayor, ", after: " muy joven de aspecto.", answer: "está", explanation: "On utilise **ESTAR** + adjectif pour exprimer une impression ou un changement par rapport à la norme." }
    ]
  ];

  let currentLevel = 0;
  let activeInput = null;

  function loadLevel() {
    const listEl = document.getElementById('questions-list');
    listEl.innerHTML = '';

    exercises[currentLevel].forEach((q, index) => {
      const item = document.createElement('div');
      item.className = 'exercise-item';
      item.innerHTML = `
        <div class="sentence">
          ${q.before}
          <input type="text" id="input-${index}" autocomplete="off" spellcheck="false" onfocus="activeInput = this">
          ${q.after}
        </div>
      `;
      listEl.appendChild(item);
    });

    document.getElementById('quiz-container').style.display = 'block';
    document.getElementById('result-container').style.display = 'none';

    // Focus sur le premier champ
    const firstInput = document.getElementById('input-0');
    if (firstInput) {
      firstInput.focus();
      activeInput = firstInput;
    }
  }

  function insertChar(char) {
    if (!activeInput) {
      activeInput = document.querySelector('input[type="text"]');
    }
    if (activeInput) {
      const start = activeInput.selectionStart;
      const end = activeInput.selectionEnd;
      activeInput.value = activeInput.value.substring(0, start) + char + activeInput.value.substring(end);
      activeInput.focus();
      activeInput.setSelectionRange(start + 1, start + 1);
    }
  }

  function submitAnswers() {
    let score = 0;
    const currentExercises = exercises[currentLevel];
    const correctionsList = document.getElementById('corrections-list');
    correctionsList.innerHTML = '';

    currentExercises.forEach((q, index) => {
      const inputEl = document.getElementById(`input-${index}`);
      const userAnswer = inputEl ? inputEl.value.trim().toLowerCase() : '';
      const isCorrect = userAnswer === q.answer.toLowerCase();

      if (isCorrect) score++;

      const corrItem = document.createElement('div');
      corrItem.className = `correction-item ${isCorrect ? 'correct' : 'incorrect'}`;
      corrItem.innerHTML = `
        <strong>${q.before} <u style="text-decoration-thickness: 2px;">${userAnswer || '___'}</u> ${q.after}</strong>
        ${!isCorrect ? `<br><span>Réponse correcte : <strong>${q.answer}</strong></span>` : ''}
        <div class="explanation">${q.explanation}</div>
      `;
      correctionsList.appendChild(corrItem);
    });

    document.getElementById('score-text').textContent = `${score} / ${currentExercises.length}`;
    document.getElementById('quiz-container').style.display = 'none';
    document.getElementById('result-container').style.display = 'block';
  }

  function changeLevel(levelIndex) {
    currentLevel = levelIndex;
    const btns = document.querySelectorAll('.level-btn');
    btns.forEach((btn, idx) => {
      btn.classList.toggle('active', idx === levelIndex);
    });
    loadLevel();
  }

  function restartLevel() {
    loadLevel();
  }

  // Initialisation au chargement de la page
  loadLevel();
</script>

</body>
</html>
